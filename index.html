<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Event Playground</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>🎉 JavaScript Playground</h1>

    <section class="slideshow-section">
        <h2>🖼️ Interactive Image Slideshow</h2>
        <div class="slideshow-container">
            <img src="img/grad.jpg" class="slide active" alt="Slide 1" />
            <img src="img/IMG-20240313-WA0854.jpg" class="slide" alt="Slide 2" />
            <img src="img/my face.jpg" class="slide" alt="Slide 3" />
            <div class="slideshow-controls">
                <button id="prevBtn">⏮️ Prev</button>
                <button id="nextBtn">⏭️ Next</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
